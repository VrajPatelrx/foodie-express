<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Foodie Express</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FoodieExpress">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--bg); min-height:100vh; display:flex; flex-direction:column;">
<div class="app-shell" style="max-width:540px; margin:auto; padding-top:40px; padding-bottom:60px;">

  <!-- Brand -->
  <div style="text-align:center; margin-bottom:24px;">
    <div class="brand" style="justify-content:center; font-size:26px;">
      <div class="brand-icon" style="width:42px; height:42px;">
        <img src="icons/icon.svg" alt="Foodie Express Logo">
      </div>
      <div>FOODIE <span>EXPRESS</span></div>
    </div>
    <p style="color:var(--ink-secondary); font-size:14px; margin:6px 0 0;">
      Real-Time On-Demand Delivery Platform
    </p>
  </div>

  <!-- 1-Click Quick Demo Login Bar -->
  <div class="card" style="background:linear-gradient(135deg, #FFF7ED, #FFFAF5); border:1.5px dashed var(--primary); margin-bottom:24px;">
    <div style="font-size:12px; font-weight:800; text-transform:uppercase; color:var(--primary); letter-spacing:0.05em; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      1-Click Demo Access
    </div>
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;">
      <button class="btn-secondary demo-btn" data-role="CUSTOMER" style="font-size:12px; padding:8px 10px; justify-content:flex-start; display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <strong>Customer:</strong> Aarav
      </button>
      <button class="btn-secondary demo-btn" data-role="VENDOR" style="font-size:12px; padding:8px 10px; justify-content:flex-start; display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <strong>Kitchen:</strong> Anand Tiffin
      </button>
      <button class="btn-secondary demo-btn" data-role="RIDER" style="font-size:12px; padding:8px 10px; justify-content:flex-start; display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 5.5l1.5-4.5h3.5l2 4"/><path d="M9 17.5l2-6.5h3.5l1.5 6.5"/></svg>
        <strong>Rider:</strong> Ramesh
      </button>
      <button class="btn-secondary demo-btn" data-role="ADMIN" style="font-size:12px; padding:8px 10px; justify-content:flex-start; display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <strong>Admin:</strong> Operations
      </button>
    </div>
  </div>

  <!-- Auth Card -->
  <div class="card" style="padding:28px;">
    <!-- Switcher Tabs -->
    <div style="display:flex; border-bottom:1px solid var(--border); margin-bottom:20px;">
      <button id="tabLogin" class="tab-btn active" style="flex:1; padding:10px; background:none; border:none; border-bottom:2px solid var(--primary); font-weight:800; font-size:15px; cursor:pointer; color:var(--ink);">
        Sign In
      </button>
      <button id="tabRegister" class="tab-btn" style="flex:1; padding:10px; background:none; border:none; border-bottom:2px solid transparent; font-weight:600; font-size:15px; cursor:pointer; color:var(--ink-secondary);">
        Register New User
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm">
      <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="name@example.com" value="customer@foodie.com" style="width:100%; height:42px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:6px;">Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter password" value="foodie123" style="width:100%; height:42px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:14px; font-weight:800;">
        Sign In
      </button>
    </form>

    <!-- Register Form (Hidden Initially) -->
    <form id="registerForm" style="display:none;">
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:4px;">Full Name</label>
        <input type="text" id="regName" required placeholder="e.g. Aarav Patel" style="width:100%; height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:4px;">Mobile Number</label>
        <input type="tel" id="regPhone" required maxlength="10" placeholder="10-digit mobile number" style="width:100%; height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:4px;">Email Address</label>
        <input type="email" id="regEmail" required placeholder="name@example.com" style="width:100%; height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <div style="margin-bottom:14px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:4px;">Password</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters" style="width:100%; height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px;">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block; font-size:13px; font-weight:700; margin-bottom:4px;">Account Role</label>
        <select id="regRole" style="width:100%; height:40px; padding:0 12px; border-radius:8px; border:1px solid var(--border); box-sizing:border-box; font-size:14px; background:#fff;">
          <option value="CUSTOMER">Customer</option>
          <option value="VENDOR">Restaurant Kitchen (Vendor)</option>
          <option value="RIDER">Delivery Partner (Rider)</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:14px; font-weight:800;">
        Create Account
      </button>
    </form>
  </div>

  <div style="text-align:center; margin-top:16px;">
    <a href="index.html" class="back-link" style="margin:0;">← Back to Role Selector</a>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
