<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer · Foodie Express</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FoodieExpress">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="masthead">
    <div class="brand">
      <div class="brand-icon">🥗</div>
      <div>FOODIE <span>EXPRESS</span></div>
      <span class="pure-veg-tag hide-mobile" style="margin-left:6px; font-size:10px; padding:2px 6px;">🌿 100% VEG</span>
    </div>
    <div class="header-actions" id="headerActions">
      <button id="pwaInstallBtn" class="btn-secondary hide-mobile" onclick="PWA.install()" style="display:none; padding:5px 10px; font-size:11px; color:var(--primary); border-color:var(--primary);">
        📱 Install App
      </button>
      <a class="btn-secondary hide-mobile" href="index.html" style="padding:6px 12px; font-size:12px;">⇄ Switch Role</a>
      <div class="role-tag hide-mobile">Customer</div>
    </div>
  </div>

  <!-- Desktop Navigation Bar -->
  <div id="desktopNav" class="customer-nav-bar">
    <button class="customer-nav-tab active" data-nav="browse">🍽️ Explore Restaurants</button>
    <button class="customer-nav-tab" data-nav="orders">📜 My Orders <span id="desktopOrderBadge" style="display:none; background:var(--primary); color:#fff; font-size:10px; padding:1px 6px; border-radius:999px; font-weight:800; margin-left:4px;">1</span></button>
    <button class="customer-nav-tab" data-nav="addresses">📍 Saved Addresses</button>
    <button class="customer-nav-tab" data-nav="profile">👤 My Profile</button>
  </div>

  <div id="view"></div>
</div>

<!-- Mobile Bottom Navigation Bar (Swiggy / Zomato Style) -->
<nav class="mobile-bottom-nav">
  <button class="nav-btn active" data-nav="browse">
    <span class="icon">🍽️</span>
    <span>Explore</span>
  </button>
  <button class="nav-btn" data-nav="orders">
    <span class="icon">📜</span>
    <span>My Orders</span>
    <span id="mobileOrderBadge" class="badge-count" style="display:none;">1</span>
  </button>
  <button class="nav-btn" data-nav="addresses">
    <span class="icon">📍</span>
    <span>Addresses</span>
  </button>
  <button class="nav-btn" data-nav="profile">
    <span class="icon">👤</span>
    <span>Account</span>
  </button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
