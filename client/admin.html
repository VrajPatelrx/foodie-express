<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Admin · Foodie Express</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FoodieExpress">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell wide">
  <div class="masthead">
    <div class="brand">
      <div class="brand-icon">
        <img src="icons/icon.svg" alt="Foodie Express Logo">
      </div>
      <div>FOODIE <span>EXPRESS</span></div>
    </div>
    <div class="header-actions">
      <button id="phoneModalBtn" class="btn-secondary admin-qr-btn" title="Open QR Code to connect mobile devices" style="padding:6px 14px; font-size:12px; color:var(--primary); border-color:var(--primary); font-weight:700; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; white-space:nowrap; cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mobile Access
      </button>
      <button id="adminSignOutBtn" class="btn-secondary" style="padding:6px 14px; font-size:12px; height:32px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
      <a class="btn-secondary hide-mobile" href="index.html" style="padding:6px 14px; font-size:12px; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; border-radius:999px; text-decoration:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Switch Role
      </a>
      <div class="role-tag hide-mobile" style="background:var(--purple-soft); color:var(--purple); border-color:var(--purple); height:32px; display:inline-flex; align-items:center; justify-content:center;">Operations Admin</div>
    </div>
  </div>

  <div id="view"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
<script>
  function openPhoneModal() {
    fetch('/api/network-info').then(r => r.json()).then(net => {
      let currentRole = 'customer';
      const staticBase = net.tunnelUrl || (window.location.protocol === 'https:' ? window.location.origin : '');
      let useHttps = Boolean(staticBase);
      const rolePaths = {
        customer: '/customer.html',
        kitchen: '/vendor.html',
        rider: '/rider.html',
        admin: '/admin.html'
      };

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const roleLabels = {
        customer: 'Customer Portal',
        kitchen: 'Kitchen KDS',
        rider: 'Rider Portal',
        admin: 'Admin Console'
      };

      function renderContent() {
        const url = useHttps ? (staticBase + rolePaths[currentRole]) : ((net.roles && net.roles[currentRole]) || net.localUrl);
        overlay.innerHTML = `
          <div class="modal-card" style="max-width:480px; text-align:center;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h3 style="font-size:18px; margin:0; display:flex; align-items:center; gap:8px;">
                Mobile Device Access
              </h3>
              <button class="btn-secondary" id="closePhoneModal" style="padding:4px 8px; font-size:12px; justify-content:center;">✕</button>
            </div>
            
            <p style="font-size:13px; color:var(--ink-secondary); margin:0 0 14px; text-align:center;">
              Select a portal and protocol to generate a real-time QR code:
            </p>

            <!-- Protocol Selector -->
            <div style="display:flex; justify-content:center; gap:8px; margin-bottom:14px;">
              <button class="btn-secondary" id="toggleHttpsBtn" style="padding:5px 12px; font-size:11px; border-radius:999px; ${useHttps ? 'background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700;' : ''}">
                HTTPS Tunnel
              </button>
              <button class="btn-secondary" id="toggleWifiBtn" style="padding:5px 12px; font-size:11px; border-radius:999px; ${!useHttps ? 'background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700;' : ''}">
                Local Wi-Fi
              </button>
            </div>

            <!-- Role Selector Pills -->
            <div style="display:flex; gap:6px; margin-bottom:16px; justify-content:center; flex-wrap:wrap;">
              ${Object.keys(roleLabels).map(role => `
                <button class="btn-secondary pill-role-btn" data-role="${role}" style="padding:6px 12px; font-size:12px; border-radius:999px; ${currentRole === role ? 'background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700;' : ''}">
                  ${roleLabels[role]}
                </button>
              `).join('')}
            </div>

            <!-- QR Code Card -->
            <div style="background:#fff; padding:14px; display:inline-block; border-radius:var(--radius); border:2px solid var(--border); margin-bottom:12px; box-shadow:var(--shadow-sm);">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}" alt="Scan QR Code" style="display:block; width:180px; height:180px;">
            </div>

            <div style="background:var(--surface-alt); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:13px; margin-bottom:14px; word-break:break-all; text-align:center;">
              <div style="font-size:11px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; margin-bottom:2px; text-align:center;">Target Address</div>
              <code style="font-weight:800; font-size:13px; color:var(--primary); display:block; text-align:center;">${url}</code>
            </div>

            <button class="btn-secondary" id="closePhoneModalBtn" style="width:100%; justify-content:center; text-align:center;">Close</button>
          </div>
        `;

        overlay.querySelector('#closePhoneModal').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#closePhoneModalBtn').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#toggleHttpsBtn').addEventListener('click', () => { 
          if (!staticBase) {
            alert('To enable HTTPS Tunnel, set NGROK_DOMAIN or TUNNEL_URL in your private .env file and run tunnel.bat.');
            return;
          }
          useHttps = true; 
          renderContent(); 
        });
        overlay.querySelector('#toggleWifiBtn').addEventListener('click', () => { useHttps = false; renderContent(); });
        overlay.querySelectorAll('.pill-role-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            currentRole = btn.getAttribute('data-role');
            renderContent();
          });
        });
      }

      renderContent();
      document.body.appendChild(overlay);
    }).catch(err => {
      alert('Could not fetch network info: ' + err.message);
    });
  }

  document.addEventListener('click', (e) => {
    if (e.target && (e.target.id === 'phoneModalBtn' || e.target.closest('#phoneModalBtn'))) {
      openPhoneModal();
    }
  });
</script>
</body>
</html>
